name: Lucas v1.0 signals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram setup test only (does not run Kronos)"
        required: false
        type: boolean
        default: false
      force_swing:
        description: "Run the swing forecast even if the last 4h candle has not changed"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lucas-v1-signals
  cancel-in-progress: false

jobs:
  run-lucas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: /home/runner/.cache/huggingface
      LUCAS_CONFIG: config.yaml
      LUCAS_STATE_FILE: .lucas_state.json
      LUCAS_KRONOS_REPO: /tmp/Kronos
      LUCAS_FORCE_SWING: ${{ github.event_name == 'workflow_dispatch' && inputs.force_swing || 'false' }}
      LUCAS_TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Get Lucas source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Kronos model cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface/hub
          key: lucas-v1-hf-kronos-base-ubuntu-v1
          restore-keys: |
            lucas-v1-hf-kronos-base-ubuntu-

      - name: Restore Lucas alert state
        uses: actions/cache/restore@v4
        with:
          path: .lucas_state.json
          key: lucas-v1-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lucas-v1-state-

      - name: Initialize state if this is the first run
        shell: bash
        run: |
          if [ ! -f .lucas_state.json ]; then
            printf '{"version":1,"alerts":{},"swing_anchors":{}}\n' > .lucas_state.json
          fi

      - name: Install Lucas dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Get official Kronos code
        if: env.LUCAS_TEST_TELEGRAM != 'true'
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git "$LUCAS_KRONOS_REPO"

      - name: Install CPU-only PyTorch
        if: env.LUCAS_TEST_TELEGRAM != 'true'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"

      - name: Install Kronos dependencies
        if: env.LUCAS_TEST_TELEGRAM != 'true'
        run: |
          python -m pip install \
            "einops==0.8.1" \
            "huggingface_hub==0.33.1" \
            "matplotlib==3.9.3" \
            "pandas==2.2.2" \
            "safetensors==0.6.2" \
            "tqdm==4.67.1"

      - name: Run Lucas v1.0
        run: python lucas.py

      - name: Save alert cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lucas_state.json
          key: lucas-v1-state-${{ github.run_id }}-${{ github.run_attempt }}
